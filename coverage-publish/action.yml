name: 'Publish Coverage'
description: 'Publish coverage to remote repository and update badge'

inputs:
  config-path:
    description: 'Path to test coverage config'
    required: false
    default: ''
  coverage-repo:
    description: 'Repository to publish coverage to'
    required: false
    default: 'DecisiveAI/platform-health'
  app-id:
    description: 'GitHub App ID for authentication'
    required: true
  private-key:
    description: 'GitHub App private key'
    required: true
  github-token:
    description: 'GitHub token for badge updates'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Validate GitHub App ID
      shell: bash
      run: |
        if [[ -z "${{ inputs.app-id }}" ]]; then
          echo "❌ Error: GitHub App ID is required but not provided"
          exit 1
        fi

        # Check if app-id is numeric
        if [[ ! "${{ inputs.app-id }}" =~ ^[0-9]+$ ]]; then
          echo "❌ Error: GitHub App ID must be numeric, got: '${{ inputs.app-id }}'"
          exit 1
        fi

        if [[ ${{ inputs.app-id }} -lt 100000 ]]; then
          echo "❌ Error: GitHub App ID seems too small: ${{ inputs.app-id }}"
          echo "Expected a 6+ digit number"
          exit 1
        fi

        echo "✅ GitHub App ID validation passed"

    - name: Validate GitHub App Private Key
      shell: bash
      run: |
        if [[ -z "${{ inputs.private-key }}" ]]; then
          echo "❌ Error: GitHub App private key is required but not provided"
          exit 1
        fi

        if [[ ! "${{ inputs.private-key }}" =~ "-----BEGIN".*"PRIVATE KEY-----" ]]; then
          echo "❌ Error: Private key doesn't appear to be in PEM format"
          echo "Expected format: -----BEGIN [RSA] PRIVATE KEY-----"
          exit 1
        fi

        if [[ ! "${{ inputs.private-key }}" =~ "-----END".*"PRIVATE KEY-----" ]]; then
          echo "❌ Error: Private key missing END marker"
          exit 1
        fi

        # Check minimum length (GitHub App keys are typically 1600+ chars)
        key_length=${#{{ inputs.private-key }}}
        if [[ $key_length -lt 1500 ]]; then
          echo "❌ Error: Private key seems too short: $key_length characters"
          echo "Expected at least 1500 characters for a valid RSA private key"
          exit 1
        fi

        echo "✅ GitHub App private key validation passed"

    - name: Validate GitHub Token
      shell: bash
      run: |
        if [[ -z "${{ inputs.github-token }}" ]]; then
          echo "❌ Error: GitHub token is required but not provided"
          exit 1
        fi

        # Check token format patterns
        token="${{ inputs.github-token }}"

        # GitHub personal access tokens start with 'ghp_' (classic) or 'github_pat_' (fine-grained)
        # GitHub App installation tokens start with 'ghs_'
        if [[ ! "$token" =~ ^(ghp_|github_pat_|ghs_) ]]; then
          echo "❌ Error: GitHub token format not recognized"
          echo "Expected token starting with: ghp_, github_pat_, or ghs_"
          exit 1
        fi

        # Check minimum length
        token_length=${#token}
        if [[ $token_length -lt 20 ]]; then
          echo "❌ Error: GitHub token seems too short: $token_length characters"
          exit 1
        fi

        # Test token validity with a simple API call
        response=$(curl -s -w "%{http_code}" -o /dev/null \
          -H "Authorization: Bearer $token" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/user)

        if [[ "$response" != "200" ]]; then
          echo "❌ Error: GitHub token validation failed (HTTP $response)"
          echo "Token may be invalid, expired, or lack required permissions"
          exit 1
        fi

        echo "✅ GitHub token validation passed"

    - name: Download coverage artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: code-coverage
        path: .

    - name: Generate test coverage report and breakdown
      id: coverage
      continue-on-error: true
      uses: vladopajic/go-test-coverage@ebf1fb6f7267bd290a83cc16f535067b51fd1d0b
      with:
        config: ${{ inputs.config-path || format('{0}/.testcoverage.yml', github.action_path) }}
        profile: coverage.out

    - name: Upload breakdown as baseline for future diffs
      uses: actions/upload-artifact@89ef406dd8d7e03cfd12d9e0a4a378f454709029
      with:
        name: main-breakdown
        path: main.breakdown

    - name: Save coverage report to file
      shell: bash
      env:
        COVERAGE_REPORT: ${{ steps.coverage.outputs.report }}
        REPO_NAME: ${{ github.event.repository.name }}
      run: |
        echo "${COVERAGE_REPORT}" > "coverage-${REPO_NAME}.txt"

    - name: Extract repository info
      id: repo-info
      shell: bash
      env:
        COVERAGE_REPO: ${{ inputs.coverage-repo }}
      run: |
        echo "owner=${COVERAGE_REPO%/*}" >> "$GITHUB_OUTPUT"
        echo "repo=${COVERAGE_REPO#*/}" >> "$GITHUB_OUTPUT"

    - name: Generate GitHub App token
      uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e
      id: generate_token
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ steps.repo-info.outputs.owner }}
        repositories: |
          ${{ github.event.repository.name }}
          ${{ steps.repo-info.outputs.repo }}

    - name: Publish coverage to remote repository
      shell: bash
      env:
        GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        COVERAGE_REPO: ${{ inputs.coverage-repo }}
        REPO_NAME: ${{ github.event.repository.name }}
      run: |
        # Clone the coverage repository
        git clone "https://x-access-token:${GH_TOKEN}@github.com/${COVERAGE_REPO}.git" coverage-repo
        cd coverage-repo
        
        # Configure git
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        
        # Copy the new coverage file
        cp "../coverage-${REPO_NAME}.txt" .
        
        # Commit and push changes
        git add "coverage-${REPO_NAME}.txt"
        if git diff --cached --quiet; then
          echo "✅ No changes to commit."
          exit 0
        fi
        git commit -m "chore: Update coverage report for ${REPO_NAME} from CI"
        git push origin main

    - name: Generate Go Coverage Badge
      id: generate-badge
      uses: tj-actions/coverage-badge-go@481919ec72da287775fef015fd9011dc75a5db05
      with:
        filename: coverage.out

    - name: Commit badge changes
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        git fetch origin main
        git checkout main
        git pull origin main

        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        git add README.md
        git commit -m "chore: Updated coverage badge. [skip ci]" || echo "No changes to commit"
        git push origin main