name: Changelog

on:
  workflow_call:
    inputs:
      docker-image-name:
        required: true
        type: string

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate full changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Print the changelog
        run: cat "${{ steps.git-cliff.outputs.changelog }}" >> $GITHUB_STEP_SUMMARY
      
      - name: Generate release changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff-release
        with:
          config: cliff.toml
          args: -v --latest --strip header
        env:
          OUTPUT: RELEASE-CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create a release
        uses: svenstaro/upload-release-action@v2
        with:
          file: CHANGELOG.md
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          body: |
            # 🐙 ${{ inputs.docker-image-name }} ${{ github.ref_name }}

            ${{ steps.git-cliff-release.outputs.content }}

            ---

            > Docker images for this release can be found at public.ecr.aws/p3k6k6h3/${{ inputs.docker-image-name }}:${{ github.ref_name }}
      
      - name: Checkout changelog repo
        uses: actions/checkout@v4
        with:
          repository: DecisiveAI/changelogs
          path: ./mdai-changelogs

      - name: Get changelog app token
        id: app-token
        uses: getsentry/action-github-app-token@v3.0.0
        with:
          app_id: ${{ secrets.CHANGELOG_APP_ID }}
          private_key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}

      - name: Commit changelog
        run: |
          cd ./mdai-changelogs
          cp ../CHANGELOG.md ./${{ inputs.docker-image-name }}.md
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          set +e
          git add ${{ inputs.docker-image-name }}.md
          git commit -m "Update ${{ inputs.docker-image-name }} changelog for ${{ github.ref_name }}"
          git push https://${{ steps.app-token.outputs.token }}@github.com/DecisiveAI/changelogs.git rlaw/testing-auto-changelogs
