name: Notify Slack on Deployment

on:
  workflow_call:
    inputs:
      deployed-url:
        required: true
        type: string
    secrets:
      SLACK_NOTIFY_URL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Deploy Notification
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \":netscape: ${{inputs.deployed-url}} deployed by ${{ github.actor }}\n:think-render: ref '${{ github.ref_name }}' using workflow '${{github.workflow}}'\n:computer-cat: Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ secrets.SLACK_NOTIFY_URL }}"
