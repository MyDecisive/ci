name: Publish Docker Image to GHCR

on:
  workflow_call:
    inputs:
      image_name_suffix:
        description: 'Custom suffix for the Docker image name. Defaults to "github.event.repository.name"'
        required: false
        type: string
      dockerfile_name:
        description: 'Custom Dockerfile name. Defaults to "Dockerfile"'
        required: false
        type: string
      context:
        description: 'Custom `docker build` context. Defaults to "."'
        required: false
        type: string
        default: '.'
      build_contexts:
        description: 'Additional build contexts. Defaults to ""'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref to build from. Defaults to github.ref'
        required: false
        type: string
      build-args:
        description: 'List of build-time variables. Default to []'
        required: false
        type: string
        default: '[]'
    secrets:
      SLACK_NOTIFY_URL:
        required: true

jobs:
  publish-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve tag name
        id: resolve_ref
        env:
          EFFECTIVE_REF: ${{ inputs.ref || github.ref }}
        shell: bash
        run: |
          # Normalize short tag refs (e.g. v1.2.3 → refs/tags/v1.2.3)
          if [[ ! "$EFFECTIVE_REF" == refs/* ]] && [[ "$EFFECTIVE_REF" =~ ^v[0-9] ]]; then
            EFFECTIVE_REF="refs/tags/$EFFECTIVE_REF"
          fi
          TAG_NAME="${EFFECTIVE_REF#refs/tags/}"
          REF_NAME="${TAG_NAME#refs/heads/}"
          {
            echo "tag_name=$TAG_NAME"
            echo "ref_name=$REF_NAME"
            echo "short_sha=$(git rev-parse --short HEAD)"
            [[ "$EFFECTIVE_REF" == refs/tags/* ]] && echo "is_tag=true" || echo "is_tag=false"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name_suffix || github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.resolve_ref.outputs.tag_name }},enable=${{ steps.resolve_ref.outputs.is_tag == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.resolve_ref.outputs.tag_name }},enable=${{ steps.resolve_ref.outputs.is_tag == 'true' && !startsWith(steps.resolve_ref.outputs.tag_name, 'v0.0') }}
            type=semver,pattern={{major}},value=${{ steps.resolve_ref.outputs.tag_name }},enable=${{ steps.resolve_ref.outputs.is_tag == 'true' && !startsWith(steps.resolve_ref.outputs.tag_name, 'v0.') }}
            type=raw,value=${{ steps.resolve_ref.outputs.ref_name }},enable=${{ steps.resolve_ref.outputs.is_tag == 'false' }}
            type=raw,value=sha-${{ steps.resolve_ref.outputs.short_sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          build-contexts: ${{ inputs.build_contexts }}
          push: ${{ steps.resolve_ref.outputs.is_tag == 'true' || github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ inputs.image_name_suffix || github.event.repository.name }}
          cache-to: type=gha,scope=${{ inputs.image_name_suffix || github.event.repository.name }},mode=max,ignore-error=true
          file: ${{ inputs.dockerfile_name || 'Dockerfile' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            ${{ join(fromJSON(inputs.build-args), '
            ') }}
  notify-on-failure:
    needs: publish-docker
    if: failure() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: MyDecisive/ci/.github/workflows/slack-notify.yml@main
    secrets:
      SLACK_NOTIFY_URL: ${{ secrets.SLACK_NOTIFY_URL }}
