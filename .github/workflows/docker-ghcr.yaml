name: Publish Docker Image to GHCR

on:
  workflow_call:
    inputs:
      image_name_suffix:
        description: 'Custom suffix for the Docker image name. Defaults to "github.event.repository.name"'
        required: false
        type: string
      dockerfile_name:
        description: 'Custom Dockerfile name. Defaults to "Dockerfile"'
        required: false
        type: string
      context:
        description: 'Custom `docker build` context. Defaults to "."'
        required: false
        type: string
        default: '.'
      build_contexts:
        description: 'Additional build contexts. Defaults to ""'
        required: false
        type: string
        default: ''
    secrets:
      SLACK_NOTIFY_URL:
        required: true

jobs:
  publish-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name_suffix || github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          build-contexts: ${{ inputs.build_contexts }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ${{ inputs.dockerfile_name || 'Dockerfile' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  notify-failure:
    needs: publish-docker
    if: failure() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: MyDecisive/ci/.github/workflows/slack-notify-failure.yml@notify_testing
    secrets:
      SLACK_NOTIFY_URL: ${{ secrets.SLACK_NOTIFY_URL }}

  notify-success:
    needs: publish-docker
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: MyDecisive/ci/.github/workflows/slack-notify-success.yml@notify_testing
    secrets:
      SLACK_NOTIFY_URL: ${{ secrets.SLACK_NOTIFY_URL }}
