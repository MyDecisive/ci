name: Docker push for main branch

on:
  workflow_call:
    inputs:
      image_name_suffix:
        description: 'Custom suffix for the Docker image name. Defaults to "github.event.repository.name"'
        required: false
        type: string
      dockerfile_name:
        description: 'Custom Dockerfile name. Defaults to "Dockerfile"'
        required: false
        type: string
      context:
        description: 'Custom `docker build` context. Defaults to "."'
        required: false
        type: string
        default: '.'
      build_contexts:
        description: 'Additional build contexts. Defaults to ""'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref to build from. Defaults to github.ref'
        required: false
        type: string
    secrets:
      SLACK_NOTIFY_URL:
        required: true
      AWS_ROLE_TO_ASSUME:
        required: true

jobs:
  build-and-publish:
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve tag name
        id: resolve_ref
        env:
          EFFECTIVE_REF: ${{ inputs.ref || github.ref }}
        shell: bash
        run: |
          # Normalize short tag refs (e.g. v1.2.3 → refs/tags/v1.2.3)
          if [[ ! "$EFFECTIVE_REF" == refs/* ]] && [[ "$EFFECTIVE_REF" =~ ^v[0-9] ]]; then
            EFFECTIVE_REF="refs/tags/$EFFECTIVE_REF"
          fi
          TAG_NAME="${EFFECTIVE_REF#refs/tags/}"
          {
            echo "tag_name=$TAG_NAME"
            echo "short_sha=$(git rev-parse --short HEAD)"
            [[ "$EFFECTIVE_REF" == refs/tags/* ]] && echo "is_tag=true" || echo "is_tag=false"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr-public.outputs.registry }}/decisiveai/${{ inputs.image_name_suffix || github.event.repository.name }}
          tags: |
            type=raw,value=sha-${{ steps.resolve_ref.outputs.short_sha }},priority=100
            type=semver,pattern={{version}},value=${{ steps.resolve_ref.outputs.tag_name }},enable=${{ steps.resolve_ref.outputs.is_tag == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.resolve_ref.outputs.tag_name }},enable=${{ steps.resolve_ref.outputs.is_tag == 'true' && !startsWith(steps.resolve_ref.outputs.tag_name, 'v0.0') }}
            type=semver,pattern={{major}},value=${{ steps.resolve_ref.outputs.tag_name }},enable=${{ steps.resolve_ref.outputs.is_tag == 'true' && !startsWith(steps.resolve_ref.outputs.tag_name, 'v0.') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          build-contexts: ${{ inputs.build_contexts }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: ${{ inputs.dockerfile_name || 'Dockerfile' }}
          push: ${{ steps.resolve_ref.outputs.is_tag == 'true' || github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  notify-on-failure:
    needs: build-and-publish
    if: failure() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: MyDecisive/ci/.github/workflows/slack-notify.yml@main
    secrets:
      SLACK_NOTIFY_URL: ${{ secrets.SLACK_NOTIFY_URL }}
