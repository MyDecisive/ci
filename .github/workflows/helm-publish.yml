name: Publish Helm Chart to GHCR

on:
  workflow_call:
    secrets:
      SLACK_NOTIFY_URL:
        required: true

jobs:
  publish-helm:
    name: Build and Push Helm Chart
    runs-on: ubuntu-latest
    env:
      ORAS_DRY_RUN: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Helm
        id: helm-install
        uses: azure/setup-helm@v4.3.0
        with:
          version: "v3.19.4"

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.3

      - name: Set environment variables
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "🔧 Mocking tag version for dry-run..."
            {
              echo "GITHUB_REF=refs/tags/v0.0.0-dryrun"
              echo "ORAS_DRY_RUN=true"
            } >> "$GITHUB_ENV"
            CHART_VERSION="v0.0.0-dryrun"
          else
            CHART_VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          {
            echo "CHART_NAME=charts/${GITHUB_REPOSITORY##*/}"
            echo "CHART_VERSION=${CHART_VERSION#v}"
            echo "REPO_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}"
            echo "README_URL=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v${CHART_VERSION#v}/README.md"
            echo "CHART_FILE=${GITHUB_REPOSITORY##*/}-${CHART_VERSION#v}.tgz"
          } >> "$GITHUB_ENV"

      - name: Package Helm Chart
        run: make helm-package

      - name: Log in to GitHub Container Registry
        if: env.ORAS_DRY_RUN != 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push Helm Chart to GHCR
        run: |
          echo "📦 ${ORAS_DRY_RUN:-false} mode"
          echo "{\"apiVersion\":\"v2\",\"name\":\"${CHART_NAME}\",\"version\":\"${CHART_VERSION}\"}" > config.json

          if [[ "$ORAS_DRY_RUN" == "true" ]]; then
            echo "🔬 Dry run: would execute:"
            echo "oras push ghcr.io/${REPO_OWNER_LC}/${CHART_NAME}:${CHART_VERSION} \\"
            echo "  --config config.json:application/vnd.cncf.helm.config.v1+json \\"
            echo "  ${CHART_FILE}:application/vnd.cncf.helm.chart.content.v1.tar+gzip \\"
            echo "  README.md:text/markdown \\"
            echo "  --annotation \"org.opencontainers.image.description=Helm chart for ${CHART_NAME}\" \\"
            echo "  --annotation \"org.opencontainers.image.title=${CHART_NAME}\" \\"
            echo "  --annotation \"org.opencontainers.image.version=${CHART_VERSION}\" \\"
            echo "  --annotation \"org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}\" \\"
            echo "  --annotation \"io.artifacthub.package.readme-url=${README_URL}\""
          else
            oras push "ghcr.io/${REPO_OWNER_LC}/${CHART_NAME}:${CHART_VERSION}" \
              --config config.json:application/vnd.cncf.helm.config.v1+json \
              "${CHART_FILE}:application/vnd.cncf.helm.chart.content.v1.tar+gzip" \
              "README.md:text/markdown" \
              --annotation "org.opencontainers.image.description=Helm chart for ${CHART_NAME}" \
              --annotation "org.opencontainers.image.title=${CHART_NAME}" \
              --annotation "org.opencontainers.image.version=${CHART_VERSION}" \
              --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --annotation "io.artifacthub.package.readme-url=${README_URL}"
          fi

  notify-on-failure:
    needs: publish-helm
    if: failure() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: MyDecisive/ci/.github/workflows/slack-notify.yml@main
    secrets:
      SLACK_NOTIFY_URL: ${{ secrets.SLACK_NOTIFY_URL }}