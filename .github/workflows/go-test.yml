name: Go Test

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Ubuntu
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Run Go tests
        uses: mydecisive/ci/go-test@45efd1d9a3b3b65fd7e2e1e4fee22f31d4473db8
        with:
          timeout: 10m
