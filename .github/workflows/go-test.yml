name: Go Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test on Ubuntu
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Run Go tests
        uses: decisiveai/ci/go-test@e7af2d3f21d9f52bf7b88a07b5a08b7fd4db91bd
        with:
          timeout: 10m