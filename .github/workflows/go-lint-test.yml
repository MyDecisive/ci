name: Go CI

on:
  workflow_call:
    inputs:
      config-path:
        description: 'Path to test coverage config'
        type: string
        required: false
        default: ''
      coverage-repo:
        description: 'Repository to publish coverage to'
        type: string
        required: false
        default: 'DecisiveAI/platform-health'
    secrets:
      APP_PRIVATE_KEY:
        description: 'GitHub App private key'
        required: true
      PLATFORM_HEALTH_ACCESS_APP_ID:
        description: 'GitHub App ID'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint on Ubuntu
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Validate inputs
        run: |
          if [[ -n "${{ inputs.coverage-repo }}" ]]; then
            if [[ ! "${{ inputs.coverage-repo }}" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
              echo "Error: Invalid coverage-repo format"
              exit 1
            fi
          fi
          
          if [[ "${{ inputs.config-path }}" =~ \.\. ]]; then
            echo "Error: config-path contains invalid characters"
            exit 1
          fi

      - name: Run Go lint
        uses: decisiveai/ci/go-lint@f2e1e3d9bfdc66b95fb8bd2a9ce59b25613a3de5
        with:
          timeout: 5m

  check-go-file-changes:
    name: Check if Go files changed
    runs-on: ubuntu-latest
    needs: lint

    permissions:
      contents: read

    outputs:
      go_files_changed: ${{ steps.check.outputs.go_files_changed }}

    steps:
      - name: Clone the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine base commit
        id: base
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_COMMIT="${{ github.event.pull_request.base.sha }}"
            # Validate SHA format
            if [[ ! "$BASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
              echo "Error: Invalid base commit SHA"
              exit 1
            fi
          else
            BASE_COMMIT=$(git rev-parse HEAD~1)
          fi
          echo "BASE_COMMIT=$BASE_COMMIT" >> "$GITHUB_ENV"

      - name: Check for Go-related file changes
        id: check
        run: |
          # Ensure we're working with valid commits
          if ! git cat-file -e "$BASE_COMMIT"; then
            echo "Error: Base commit not found"
            exit 1
          fi
          
          git fetch origin main
          
          # Use safer approach to check file changes
          CHANGED_FILES=$(git diff --name-only "$BASE_COMMIT" HEAD -- \
            '**/*.go' \
            'go.mod' \
            'go.sum' \
            '*.go' | \
            grep -vE '^vendor/' || true)

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No relevant Go file changes detected."
            echo "go_files_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Relevant Go file changes detected:"
            echo "$CHANGED_FILES"
            echo "go_files_changed=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test on Ubuntu
    runs-on: ubuntu-latest
    needs: [lint, check-go-file-changes]
    if: needs.check-go-file-changes.outputs.go_files_changed == 'true'

    permissions:
      contents: read

    steps:
      - name: Run Go tests
        uses: decisiveai/ci/go-test@f2e1e3d9bfdc66b95fb8bd2a9ce59b25613a3de5
        with:
          timeout: 10m

  report-coverage:
    name: Report code coverage
    runs-on: ubuntu-latest
    needs: [test, check-go-file-changes]
    if: github.event_name == 'pull_request' && needs.check-go-file-changes.outputs.go_files_changed == 'true'

    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - name: Generate coverage report
        uses: decisiveai/ci/coverage-report@f2e1e3d9bfdc66b95fb8bd2a9ce59b25613a3de5
        with:
          config-path: ${{ inputs.config-path }}
          github-token: ${{ github.token }}
          timeout: 15m

  main-coverage:
    name: Generate and publish coverage on main
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Validate secrets
        run: |
          # Validate App ID is numeric
          if [[ ! "${{ secrets.PLATFORM_HEALTH_ACCESS_APP_ID }}" =~ ^[0-9]+$ ]]; then
            echo "Error: Invalid App ID format"
            exit 1
          fi
          
          # Check that private key is provided (but don't log it)
          if [[ -z "${{ secrets.APP_PRIVATE_KEY }}" ]]; then
            echo "Error: APP_PRIVATE_KEY secret is required"
            exit 1
          fi

      - name: Publish coverage
        uses: decisiveai/ci/coverage-publish@f2e1e3d9bfdc66b95fb8bd2a9ce59b25613a3de5
        with:
          config-path: ${{ inputs.config-path }}
          coverage-repo: ${{ inputs.coverage-repo }}
          app-id: ${{ secrets.PLATFORM_HEALTH_ACCESS_APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          github-token: ${{ github.token }}
          timeout: 5m