name: Go Main Coverage

on:
  workflow_call:
    inputs:
      config-path:
        description: "Path to test coverage config"
        type: string
        required: false
        default: "../../coverage-report/.testcoverage.yml"
      coverage-repo:
        description: "Repository to publish coverage to"
        type: string
        required: false
        default: "mydecisive/platform-health"
    secrets:
      APP_PRIVATE_KEY:
        description: "GitHub App private key"
        required: true
      PLATFORM_HEALTH_ACCESS_APP_ID:
        description: "GitHub App ID"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  main-coverage:
    name: Generate and publish coverage on main
    runs-on: ubuntu-latest
    env:
      GITHUB_APP_ID: ${{ secrets.PLATFORM_HEALTH_ACCESS_APP_ID }}
      GITHUB_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Validate secrets
        run: |
          if [[ ! "${GITHUB_APP_ID}" =~ ^[0-9]+$ ]]; then
            echo "Error: Invalid App ID format"
            exit 1
          fi

          if [[ -z "${GITHUB_PRIVATE_KEY}" ]]; then
            echo "Error: GITHUB_PRIVATE_KEY is required"
            exit 1
          fi

      - name: Publish coverage
        uses: mydecisive/ci/coverage-publish@45efd1d9a3b3b65fd7e2e1e4fee22f31d4473db8
        with:
          config-path: ${{ inputs.config-path }}
          coverage-repo: ${{ inputs.coverage-repo }}
          timeout: 5m
